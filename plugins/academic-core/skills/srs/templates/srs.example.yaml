intro: |
  Самостоятельная работа закрепляет материал лекций и готовит к лабораторным.
  Каждое задание сдаётся в срок, указанный в графике; оценивается по критериям ниже.
tasks:
  - week: 1
    topic: "Введение в базы данных. Виды СУБД"
    kind: "СРС"
    goal: "Научиться сравнивать СУБД по существенным критериям"
    outcomes: [РО1]
    sdg: [4]
    task: |
      Сравните три СУБД (одну реляционную, одну документную, одну на выбор) по пяти критериям:
      модель данных, лицензия, транзакции, масштабирование, типичные задачи.
    steps:
      - "Выберите три СУБД и найдите официальную документацию каждой."
      - "Заполните таблицу сравнения, для каждой ячейки укажите источник."
      - "Напишите вывод на 5–7 предложений: какую СУБД вы выбрали бы для библиотеки вуза и почему."
    submission: "Таблица и вывод в docx или pdf, загрузить в LMS"
    deadline_week: 2
    hours: 4
    criteria:
      - criterion: "Полнота сравнения"
        points: 4
        levels:
          excellent: "все 5 критериев для 3 СУБД"
          good: "пропущены 1–2 ячейки"
          satisfactory: "заполнена половина"
          poor: "меньше половины"
      - criterion: "Источники"
        points: 3
        levels:
          excellent: "у каждой ячейки ссылка на документацию"
          good: "ссылки у большинства"
          satisfactory: "1–2 ссылки"
          poor: "ссылок нет"
      - criterion: "Обоснованный вывод"
        points: 3
        levels:
          excellent: "вывод опирается на таблицу"
          good: "вывод частично опирается на таблицу"
          satisfactory: "вывод общий"
          poor: "вывода нет"
    literature:
      - "PostgreSQL Documentation. — URL: https://www.postgresql.org/docs/ (дата обращения: 01.09.2026)."
  - week: 2
    topic: "Реляционная модель. Ключи и связи"
    kind: "Практическое занятие"
    goal: "Выделить сущности и ключи предметной области"
    outcomes: [РО1, РО3]
    task: "Постройте ER-диаграмму для учёта книг в библиотеке вуза."
    submission: "ER-диаграмма (png) и список ключей"
    deadline_week: 3
    hours: 1
    criteria:
      - criterion: "Сущности и связи"
        points: 5
        levels:
          excellent: "все сущности, связи верные"
          good: "одна ошибка в связях"
          satisfactory: "2–3 ошибки"
          poor: "диаграмма не отражает задачу"
