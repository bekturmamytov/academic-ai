lecture: lectures/01-vvedenie-v-bd.md
week: 1
title: "Введение в базы данных. Виды СУБД"
subtitle: "Лекция 1"
slides:
  - type: section
    title: "Данные и база данных"
    notes: |
      Начнём с вопроса к аудитории: где вы сегодня оставили свои данные?
      Соберите 3–4 ответа и подведите к понятию базы данных.
  - type: content
    title: "Что такое база данных"
    bullets:
      - "**База данных** — связанные данные под управлением СУБД"
      - "Хранит факты о клиентах, заказах, складе"
      - text: "Работают десятки людей одновременно"
        sub: ["целостность следит система", "доступ по ролям"]
      - "Пример: регистратура поликлиники"
    notes: |
      База данных — организованная совокупность связанных данных, которую хранит и
      обслуживает СУБД. Разберите пример поликлиники: один пациент, много врачей, одна карта.
  - type: content
    title: "Как запрос проходит через СУБД"
    bullets:
      - "Клиент отправляет SQL"
      - "СУБД проверяет права"
      - "Оптимизатор строит план"
    diagram:
      kind: steps
      items: ["Запрос", "Проверка прав", "План", "Результат"]
    notes: Покажите путь запроса по шагам схемы.
  - type: content
    title: "Классы СУБД"
    diagram:
      kind: steps
      items:
        - {title: "Реляционные", text: "таблицы, SQL, транзакции"}
        - {title: "Документные", text: "JSON-документы"}
        - {title: "Ключ-значение", text: "кэш, сессии"}
        - {title: "Графовые", text: "связи между объектами"}
    notes: Коротко о четырёх классах; подробно — реляционные, им посвящён курс.
  - type: table
    title: "Файлы или СУБД"
    table:
      header: ["Подход", "Целостность", "Совместная работа"]
      rows:
        - ["Файлы", "следит человек", "плохо"]
        - ["СУБД", "следит система", "хорошо"]
    notes: Сравните два подхода по таблице и спросите, где граница перехода.
  - type: content
    title: "Данные и устойчивое развитие"
    bullets:
      - "ЦУР 4: цифровые сервисы образования"
      - "ЦУР 16: открытые данные государства"
    image:
      path: img/opendata.png
      description: "скриншот портала открытых данных"
    notes: Свяжите тему с ЦУР; цифр о доле организаций не приводите без источника.
questions:
  - "Чем база данных отличается от набора файлов?"
  - "Какие функции выполняет СУБД?"
  - "Какой класс СУБД подойдёт библиотеке и почему?"
closing_notes: Ответы на вопросы — устно, 5 минут.
