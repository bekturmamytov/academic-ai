# Дополнения к УМКД — кладётся в папку курса рядом с course.yaml.
# Всё необязательно: чего нет, скрипт соберёт черновиком из паспорта и лекций.
glossary:
  - term: "Индекс"
    definition: "Структура данных, ускоряющая поиск строк по значению столбца."
  - term: "Нормализация"
    definition: "Приведение схемы базы данных к нормальным формам для устранения избыточности и аномалий."

midterm_questions:            # 1 — первый рубежный контроль в assessment паспорта, 2 — второй
  1:
    - "Объясните, чем база данных отличается от набора файлов."
    - "Сравните первичный и внешний ключи; приведите пример."
    - "Постройте ER-диаграмму для учёта книг в библиотеке."
  2:
    - "Оцените, какие индексы нужны запросу из задания; обоснуйте."

exam_questions:
  - "Объясните реляционную модель данных: отношения, атрибуты, ключи."
  - "Напишите SQL-запрос с соединением трёх таблиц и группировкой."
  - "Спроектируйте схему базы данных предметной области до 3НФ."
  - "Оцените план выполнения запроса и предложите улучшения."

guidelines: |
  ## Как работать с курсом

  1. До лекции ответьте на вопросы для подготовки — они в конце предыдущей лекции.
  2. Лабораторные выполняйте по плану; отчёт сдавайте в LMS до срока.
  3. Перед рубежным контролем пройдите вопросы для самопроверки и глоссарий.

  ## Использование ИИ

  Можно для поиска идей и проверки себя, с указанием. Сдавать сгенерированный текст как
  свой — нарушение академической честности.
