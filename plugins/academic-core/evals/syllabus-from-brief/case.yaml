schema_version: "1.1"
name: syllabus-from-brief
description: >
  Преподаватель даёт данные курса текстом и просит силлабус. Ожидается: skill syllabus
  (через new-course) создаёт course.yaml, сводит часы (4 кр. = 120 ч), формулирует РО по
  Блуму, собирает out/syllabus_ru.docx скриптом. Нужен Bash и доступ uv к PyPI:
  --allow-tools Bash "WebFetch(domain:pypi.org)" "WebFetch(domain:files.pythonhosted.org)".
expected_outcome: os-course/course.yaml (120 ч, баллы 100, РО с глаголами Блума) и os-course/out/syllabus_ru.docx
tags: [syllabus, smoke]
runs: 1
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Write, Edit, Bash, Glob, Grep, Skill]
  prompt: |
    Составьте, пожалуйста, силлабус по моей дисциплине. Папку курса создайте здесь: ./os-course
    Вопросов не задавайте — чего нет в данных, оставьте пустым или возьмите типовое.

    Дисциплина «Операционные системы», код ПИ-305, направление 710400 Программная инженерия,
    бакалавриат, 3 курс, 5 семестр, 2026-2027 учебный год, очная, язык обучения русский.
    4 кредита. Лекции 30 ч, практические 30 ч, СРСП 15 ч, СРС 45 ч. 15 недель.
    Пререквизиты: Архитектура компьютера, Программирование на C. Постреквизит: Системное администрирование.
    Темы по неделям: 1 Назначение и архитектура ОС; 2 Процессы и потоки; 3 Планирование процессов;
    4 Синхронизация: мьютексы и семафоры; 5 Взаимоблокировки; 6 Управление памятью;
    7 Виртуальная память, рубежный контроль 1; 8 Файловые системы; 9 Ввод-вывод и драйверы;
    10 Межпроцессное взаимодействие; 11 Безопасность ОС; 12 Виртуализация и контейнеры;
    13 Linux: оболочка и скрипты; 14 Распределённые системы, рубежный контроль 2; 15 Защита проектов.
    Оценивание: практические работы 30 баллов, РК1 15, РК2 15, экзамен 40.
    Студенты должны уметь объяснять устройство ОС, писать многопоточные программы с синхронизацией,
    анализировать производительность планировщика и настраивать Linux-сервер.
    Литература: Таненбаум Э., Бос Х. Современные операционные системы. 4-е изд. — СПб.: Питер, 2015. — 1120 с.
    Я — Садыков Нурлан Маратович, ст. преподаватель кафедры программной инженерии, КГТУ, Бишкек.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(syllabus|new-course)"'
  - name: built-by-script
    type: tool_used
    tool: Bash
    input_match: 'build_syllabus\.py'
    weight: 2
  - name: docx-created
    type: file_exists
    path: "os-course/out/syllabus_ru.docx"
    weight: 2
  - name: passport-credits
    type: regex
    target: { source: file, path: os-course/course.yaml }
    pattern: 'credits:\s*4\b'
  - name: passport-quality
    type: llm
    focus: { source: file, path: os-course/course.yaml }
    weight: 2
    criteria: |
      Это паспорт курса в YAML.
      PASS, если одновременно: (1) hours: lectures 30, practicals 30, srsp 15, srs 45 (сумма 120);
      (2) в topics 15 недель, сумма часов лекций по темам 30, практических 30, СРС 45;
      (3) в outcomes 3–7 результатов, каждый text начинается с измеримого глагола
      («Объясняет», «Пишет», «Анализирует», «Настраивает» и т. п.), нет «знает/понимает/владеет»;
      (4) веса assessment в сумме 100;
      (5) литература Таненбаума есть, и ни одного источника, которого не было в запросе, с verified: true.
      FAIL, если нарушен хоть один пункт.
  - name: self-check-reported
    type: llm
    criteria: |
      PASS, если финальный ответ называет путь к готовому файлу syllabus_ru.docx и показывает
      результат самопроверки списком (что в порядке и что осталось заполнить вручную — например,
      подписи или протокол кафедры). FAIL, если файла нет или ответ просит данные, которые были в запросе.
