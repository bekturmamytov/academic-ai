title: Нормализация реляционных баз данных
course: Базы данных
teacher: Асанова Айгуль Токтогуловна
accent: "#1F4E79"
lang: ru
slides:
  - type: title
    title: Нормализация реляционных баз данных
    subtitle: Лекция 5
    notes: Здравствуйте, коллеги. Сегодня мы разберём нормализацию — способ устранить избыточность в таблицах.
  - type: section
    title: Зачем нормализовать
    notes: Начнём с вопроса, зачем вообще нужна нормализация.
  - type: bullets
    title: Аномалии ненормализованных таблиц
    bullets:
      - Аномалия вставки
      - Аномалия обновления
      - Аномалия удаления
    notes: >-
      Таблица без нормализации страдает от трёх аномалий. Аномалия вставки: нельзя добавить
      факт, не добавив лишние данные. Аномалия обновления: одно и то же значение приходится
      менять в нескольких строках. Аномалия удаления: удаляя строку, мы теряем нужные сведения.
  - type: table
    title: Нормальные формы
    table:
      header: [Форма, Требование]
      rows:
        - [1НФ, Атомарные значения в ячейках]
        - [2НФ, Нет частичных зависимостей от ключа]
        - [3НФ, Нет транзитивных зависимостей]
    notes: >-
      В таблице показаны три первые нормальные формы. Первая требует атомарных значений.
      Вторая запрещает частичные зависимости от составного ключа. Третья убирает транзитивные зависимости.
  - type: bullets
    title: Как привести таблицу к 3НФ
    bullets:
      - Выделить ключ каждой сущности
      - Вынести повторяющиеся группы в отдельные таблицы
      - Связать таблицы внешними ключами
      - "– ключ дочерней таблицы ссылается на родительскую"
      - Проверить зависимости неключевых атрибутов
    notes: >-
      Порядок действий такой. Сначала выделяем ключ каждой сущности. Затем выносим
      повторяющиеся группы в отдельные таблицы. После этого связываем таблицы внешними ключами.
      И наконец, проверяем, от чего зависят неключевые атрибуты.
  - type: closing
    title: Вопросы для обсуждения
    subtitle: aasanova@example.edu.kg
    bullets:
      - Какие аномалии устраняет вторая нормальная форма?
      - Когда денормализация оправдана?
    notes: >-
      На этом всё. Подумайте над двумя вопросами: какие аномалии устраняет вторая нормальная форма
      и когда денормализация оправдана.
