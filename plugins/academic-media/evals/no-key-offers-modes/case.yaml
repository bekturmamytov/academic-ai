schema_version: "1.1"
name: no-key-offers-modes
description: Преподаватель просит видео-лекцию, ключа ElevenLabs нет — skill предлагает режимы, не требует ключ.
tags: [smoke, video]
runs: 3
expected_outcome: >-
  Срабатывает video-lecture; ответ предлагает варианты голоса — своя запись и «без голоса, только титры»
  (ElevenLabs — как вариант на потом, с ключом в ~/.academic/.env), задаёт вопрос по одному,
  не просит прислать ключ в чат.
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Хочу сделать видео-лекцию для студентов по моей лекции «Нормализация баз данных» —
    слайды с заметками у меня уже готовы. Ключа ElevenLabs у меня нет и платить за озвучку
    пока не хочу. Что можно сделать?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?video-lecture"'
    arm: with-only
  - name: offers-modes
    type: llm
    criteria: |
      PASS, если ответ одновременно:
      - предлагает записать свой голос (своя запись, разложенная по слайдам);
      - предлагает видео без голоса, только с титрами/субтитрами;
      - не требует ключ ElevenLabs, чтобы продолжить;
      - не просит прислать ключ или пароль в чат.
      FAIL, если любого из этих пунктов нет, если ответ говорит, что без ключа видео сделать нельзя,
      или если он просит вставить ключ в сообщение.
  - name: no-key-in-chat
    type: regex
    pattern: '(пришлите|отправьте|вставьте|скиньте)[^.\n]{0,40}ключ'
    flags: i
    match: not_contains
