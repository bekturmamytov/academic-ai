name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: for p in plugins/*/; do claude plugin validate "$p"; done
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [academic-core, academic-research, academic-media]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y typst || pipx install typst || true
      - run: >
          uv run --with pytest --with python-docx --with python-pptx --with openpyxl
          --with pyyaml --with pillow --with httpx --with docxcompose
          pytest plugins/${{ matrix.plugin }}/tests -q -p no:cacheprovider
